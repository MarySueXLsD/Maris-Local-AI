# Builds Maris for Windows, macOS (Apple chips and Intel), Linux (x64 and ARM) and Android.
# Run it from the Actions tab ("Run workflow") to get the installers as run artifacts.
#
# To ship an update: set "version" in package.json (for example 0.2.0), optionally write
# release-notes/v0.2.0.md, commit, then push the tag v0.2.0. The workflow builds everything and
# publishes a GitHub release with the installers. Every copy of Maris that is online then shows
# "Maris 0.2.0 is available" in Updates & news, with the release notes under "What is new".
name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the version in package.json ($version). Installed copies would keep offering this update."
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            folder: windows
            sums: windows
            args: --win --x64
          - name: macOS (Apple chips and Intel)
            os: macos-latest
            folder: macos
            sums: macos
            args: --mac dmg --arm64 --x64
          - name: Linux x64
            os: ubuntu-latest
            folder: linux
            sums: linux-x64
            args: --linux AppImage deb rpm --x64
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            folder: linux
            sums: linux-arm64
            # electron-builder's deb/rpm tool (fpm) ships for x64 only; AppImage and tar.gz cover ARM.
            args: --linux AppImage tar.gz --arm64
    runs-on: ${{ matrix.os }}
    # PowerShell (the Windows default) can split "-c.directories.output=..." at the dot.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.args }} --publish never -c.directories.output=release/${{ matrix.folder }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # A code-signing certificate (docs/signing-and-antivirus.md): when these repository secrets are
          # set, Maris.exe, bin\maris.exe, the installer and the uninstaller are all signed.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      # SHA-256 of every download, for the release page and for antivirus false-positive reports.
      # The app checks its update download against these before installing it.
      - run: node scripts/checksums.cjs release/${{ matrix.folder }} ${{ matrix.sums }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Maris ${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/${{ matrix.folder }}/SHA256SUMS-*.txt
            release/${{ matrix.folder }}/*.exe
            release/${{ matrix.folder }}/*.dmg
            release/${{ matrix.folder }}/*.AppImage
            release/${{ matrix.folder }}/*.deb
            release/${{ matrix.folder }}/*.rpm

  android:
    name: Android
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      # v3 installs the "tools" package, which Google removed in September 2026 (sdkmanager then fails).
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - run: npm ci
      - run: npm ci
        working-directory: mobile
      - run: npm run mobile:build
      - run: npx cap sync android
        working-directory: mobile
      # With the release key in the secrets (a .jks in base64, its password and alias), the app is a signed
      # release build, so every version installs over the one before. Without it, a debug build as before.
      - name: Build the app
        working-directory: mobile/android
        env:
          KEYSTORE_B64: ${{ secrets.MARIS_ANDROID_KEYSTORE }}
          MARIS_ANDROID_KEY_PASSWORD: ${{ secrets.MARIS_ANDROID_KEY_PASSWORD }}
          MARIS_ANDROID_KEY_ALIAS: ${{ secrets.MARIS_ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/maris-release.jks"
            MARIS_ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/maris-release.jks" ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi
          # One flat folder: a wildcard over apk/<variant>/ would keep the variant folder in the artifact,
          # and the release step only looks at the top of dist/.
          mkdir -p "$RUNNER_TEMP/apk"
          cp app/build/outputs/apk/*/*.apk "$RUNNER_TEMP/apk/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Maris Android
          if-no-files-found: error
          path: ${{ runner.temp }}/apk/*.apk

  release:
    name: Publish the release
    needs: [desktop, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Names that say who each file is for, one SHA256SUMS.txt and install-maris-linux.sh (picks the
      # .deb, .rpm or AppImage for the computer it runs on): 10 files instead of every build output.
      - name: Name the files, add the Linux installer and the checksums
        run: node scripts/release-files.cjs dist "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"
      # The checksum list signed with the release key (scripts/sign-release.cjs, docs in scripts/release-key.mjs):
      # copies of Maris with a key built in install only signed updates. With a key built in and no secret,
      # or a secret that does not match it, the release stops here instead of reaching people it would fail.
      - name: Sign the checksums
        run: node scripts/sign-release.cjs dist/SHA256SUMS.txt
        env:
          MARIS_RELEASE_KEY: ${{ secrets.MARIS_RELEASE_KEY }}
      - name: Pick the release notes
        id: notes
        shell: bash
        run: |
          ls -la dist
          notes="release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then echo "file=$notes" >> "$GITHUB_OUTPUT"; fi
      # A published (not draft, not pre-release) release is what the app's update check finds.
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Maris ${{ github.ref_name }}
          files: dist/*
          body_path: ${{ steps.notes.outputs.file }}
          generate_release_notes: ${{ steps.notes.outputs.file == '' }}
          fail_on_unmatched_files: true
